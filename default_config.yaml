algorithm:
  class_name: PPO
  # training parameters
  # -- advantage normalization
  normalize_advantage_per_mini_batch: true
  # -- value function
  value_loss_coef: 1.0
  clip_param: 0.2
  use_clipped_value_loss: true
  # -- surrogate loss
  desired_kl: 0.01
  entropy_coef: 0.01
  gamma: 0.99
  lam: 0.95
  max_grad_norm: 1.0
  # -- training
  learning_rate: 0.0005
  num_learning_epochs: 5
  num_mini_batches: 4  # mini batch size = num_envs * num_steps / num_mini_batches
  schedule: linear_decay  # adaptive, fixed

policy:
  class_name: ActorCritic
  # for MLP i.e. `ActorCritic`
  activation: elu
  actor_hidden_dims: [1024, 1024, 512, 512, 256, 256]
  critic_hidden_dims: [1024, 1024, 512, 512, 256, 256]
  init_noise_std: 1.0
  noise_std_type: "scalar"  # 'scalar' or 'log'

  # only needed for `ActorCriticRecurrent`
  # rnn_type: 'gru'
  # rnn_hidden_dim: 1024
  # rnn_num_layers: 1


# Nombre d'environnements simulés en parallèle.
#
# 2048 a été essayé le 15 septembre 2026 et RETIRÉ : le run meurt pendant
# l'évaluation de l'itération 0, sans traceback — donc tué par signal et non
# par exception. À 1024 la mémoire GPU d'une RTX 3090 est à 33 % (7,9 Go), donc
# ~16 Go à 2048, auxquels l'évaluation ajoute les tampons de rendu hors écran.
# Le préflight, qui tourne à 4 environnements, ne pouvait structurellement pas
# le voir. Remonter ce nombre demande de vérifier la mémoire pendant une
# évaluation, pas seulement pendant l'entraînement.
num_envs: 1024

# Échantillonnage des conditions de lancer et des commandes. Voir
# `_ensure_launch_pool` et le bloc des candidats de plan dans tabletennis_env.
sampling:
  launch_pool_size: 65536            # lancers jouables gardés en réserve
  launch_pool_refresh: 100000        # tirages avant renouvellement du vivier
  launch_pool_curriculum_step: 0.05  # granularité des paliers de curriculum
  plan_candidates: 8                 # commandes évaluées d'un coup par reset
  # Compile le pas d'intégration du vol : -91 % d'opérations élémentaires, à
  # résultats identiques au bruit float32 près. Le planificateur pesait 88 %
  # du temps d'un pas, par latence de lancement de noyaux.
  compile_flight: true

num_steps_per_env: 20  # number of steps per environment per iteration
max_iterations: 3000  # number of policy updates
empirical_normalization: true
# -- logging parameters
eval_interval: 500  # check for potential saves every `eval_interval` iterations
eval_episodes: 20  # number of episodes to evaluate
save_interval: 300  # check for potential saves every `save_interval` iterations
experiment_name: competitive_tennis
run_name: ""
# -- logging writer
# ClearML instrumente TensorBoard : garder `tensorboard` ici fait remonter les
# courbes du runner dans ClearML sans autre réglage. `wandb` court-circuiterait
# cette capture.
logger: tensorboard  # tensorboard, neptune, wandb
neptune_project: competitive_tennis
wandb_project: competitive_tennis
# -- suivi d'expérience ClearML (voir docs/vast_clearml.md)
# Sans CLEARML_API_* dans l'environnement, le run continue sans suivi.
tracking:
  enabled: true
  project: ping_rl
  task_name: ""        # vide -> nom du dossier de run (date, seed, lr)
  tags: []
  offline: false       # true : écrit localement, réimportable plus tard
  upload_checkpoints: true
  upload_videos: true
  upload_interval_s: 60

# -- load and resuming
resume_path: ""

seed: 42
enable_multiccd: false  # unsupported by the pinned MuJoCo-Warp revision
enable_domain_randomization: false

# Spin command is expressed in trajectory coordinates, in rad/s:
# [topspin, sidespin, corkscrew]. Positive topspin bends the shot downwards.
spin:
  enabled: true
  analytic_contact_override: true
  reciprocal_contact_impulse: true
  aerodynamic_model: conti2026  # conti2026 or constant
  drag_enabled: true
  magnus_enabled: true
  incoming_spin_enabled: true
  planner_enabled: true
  reward_enabled: true
  command_mode: uniform  # fixed or uniform
  target: [0.0, 0.0, 0.0]
  target_range:
    low: [-400.0, -250.0, 0.0]
    high: [400.0, 250.0, 0.0]
  incoming_range:
    low: [-350.0, -250.0, -100.0]
    high: [350.0, 250.0, 100.0]
  reward_weight: 60.0
  reward_sigma: [80.0, 80.0, 100.0]
  reward_axis_weights: [1.0, 1.0, 0.0]
  landing_reward_weight: 40.0
  curriculum:
    enabled: true
    initial_scale: 0.25
    full_fraction: 0.40
  shaping:
    final_scale: 0.20
    full_fraction: 0.60
  planner:
    wrist_fraction: 0.35
    max_paddle_speed: 12.0
    max_paddle_angular_speed: 30.0
    event_root_iterations: 4
    event_integration_substeps: 3
