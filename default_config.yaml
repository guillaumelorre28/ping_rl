algorithm:
  class_name: PPO
  # training parameters
  # -- advantage normalization
  normalize_advantage_per_mini_batch: true
  # -- value function
  value_loss_coef: 1.0
  clip_param: 0.2
  use_clipped_value_loss: true
  # -- surrogate loss
  desired_kl: 0.01
  entropy_coef: 0.01
  gamma: 0.99
  lam: 0.95
  max_grad_norm: 1.0
  # -- training
  learning_rate: 0.0005
  num_learning_epochs: 5
  num_mini_batches: 4  # mini batch size = num_envs * num_steps / num_mini_batches
  schedule: linear_decay  # adaptive, fixed

policy:
  class_name: ActorCritic
  # for MLP i.e. `ActorCritic`
  activation: elu
  actor_hidden_dims: [1024, 1024, 512, 512, 256, 256]
  critic_hidden_dims: [1024, 1024, 512, 512, 256, 256]
  init_noise_std: 1.0
  noise_std_type: "scalar"  # 'scalar' or 'log'

  # only needed for `ActorCriticRecurrent`
  # rnn_type: 'gru'
  # rnn_hidden_dim: 1024
  # rnn_num_layers: 1


num_steps_per_env: 20  # number of steps per environment per iteration
max_iterations: 3000  # number of policy updates
empirical_normalization: true
# -- logging parameters
eval_interval: 500  # check for potential saves every `eval_interval` iterations
eval_episodes: 20  # number of episodes to evaluate
save_interval: 300  # check for potential saves every `save_interval` iterations
experiment_name: competitive_tennis
run_name: ""
# -- logging writer
logger: tensorboard  # tensorboard, neptune, wandb
neptune_project: competitive_tennis
wandb_project: competitive_tennis
# -- load and resuming
resume_path: ""

seed: 42
enable_multiccd: false  # unsupported by the pinned MuJoCo-Warp revision
enable_domain_randomization: false

# Spin command is expressed in trajectory coordinates, in rad/s:
# [topspin, sidespin, corkscrew]. Positive topspin bends the shot downwards.
spin:
  enabled: true
  analytic_contact_override: true
  reciprocal_contact_impulse: true
  aerodynamic_model: conti2026  # conti2026 or constant
  drag_enabled: true
  magnus_enabled: true
  incoming_spin_enabled: true
  planner_enabled: true
  reward_enabled: true
  command_mode: uniform  # fixed or uniform
  target: [0.0, 0.0, 0.0]
  target_range:
    low: [-400.0, -250.0, 0.0]
    high: [400.0, 250.0, 0.0]
  incoming_range:
    low: [-350.0, -250.0, -100.0]
    high: [350.0, 250.0, 100.0]
  reward_weight: 60.0
  reward_sigma: [80.0, 80.0, 100.0]
  reward_axis_weights: [1.0, 1.0, 0.0]
  landing_reward_weight: 40.0
  curriculum:
    enabled: true
    initial_scale: 0.25
    full_fraction: 0.40
  shaping:
    final_scale: 0.20
    full_fraction: 0.60
  planner:
    wrist_fraction: 0.35
    max_paddle_speed: 12.0
    max_paddle_angular_speed: 30.0
    event_root_iterations: 4
    event_integration_substeps: 3
