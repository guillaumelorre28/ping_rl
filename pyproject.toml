[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  {name = "The MjLab Developers"},
]
keywords = ["mujoco", "mujoco-warp", "simulation", "reinforcement-learning", "robotics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Environment :: GPU :: NVIDIA CUDA",
  "Topic :: Scientific/Engineering",
  "Natural Language :: English",
]
description = "Isaac Lab API, powered by MuJoCo-Warp, for RL and robotics research."
requires-python = ">=3.10,<3.14"
dependencies = [
  "prettytable",
  "tqdm",
  "tyro>=1.0.1",
  "torch>=2.7.0",
  "torchrunx>=0.3.4",
  "warp-lang>=1.11.0.dev20251211",
  # Version publiée plutôt qu'un commit git : la révision git figée appelait
  # `MjData.qM`, renommé `M` dès mujoco 3.13, et épinglait mujoco sur l'index
  # de builds nocturnes depuis son propre pyproject — ce qui empêchait toute
  # redescente de version. Les numéros de mujoco-warp suivent ceux de mujoco :
  # garder les deux sur 3.13.x.
  "mujoco-warp>=3.13,<3.14",
  "mujoco>=3.13,<3.14",
  "trimesh>=4.8.3",
  "viser>=1.0.16",
  "moviepy",
  "tensordict",
  # 2.3.x et non 3.x : `on_policy_runner.py` est une copie modifiée du
  # runner amont 2.3.3 (175 lignes d'écart, toutes des ajouts locaux :
  # eval_env, vidéos, viewer). rsl_rl 3.0.0 a refondu les observations en
  # groupes — `ActorCritic(obs, obs_groups, ...)` au lieu de
  # `(num_actor_obs, num_critic_obs, ...)` — et le runner vendu appelle
  # encore l'ancienne signature. Avec 3.1.0, tout run mourait sur
  # `TypeError: 'int' object is not subscriptable`, au premier
  # OnPolicyRunner. tests/test_runner_api.py verrouille la compatibilité.
  "rsl-rl-lib==2.3.3",
  "tensorboard>=2.20.0",
  "onnxscript>=0.5.4",
  "wandb>=0.22.3",
  "clearml>=2.0.2",
  # Importés directement par le code du dépôt : ml_collections et numpy par
  # tabletennis_env, imageio par on_policy_runner, yaml par train_multigpu et
  # scripts/run_jobs. Tous arrivaient par le transitif sauf ml_collections,
  # qui ne venait de nulle part et faisait échouer tout run hors du venv de
  # développement. tests/test_vast_clearml.py verrouille la règle.
  "ml-collections>=1.0",
  "numpy>=1.26",
  "imageio>=2.37",
  "pyyaml>=6.0",
]

[project.urls]
  "Bug Reports" = "https://github.com/mujocolab/mjlab/issues"
  "Source" = "https://github.com/mujocolab/mjlab"

[project.scripts]
train = "mjlab.scripts.train:main"
play = "mjlab.scripts.play:main"
demo = "mjlab.scripts.demo:main"
list_envs = "mjlab.scripts.list_envs:main"
viz-nan = "mjlab.scripts.nan_viz:main"

[dependency-groups]
dev = [
  "ipdb>=0.13.13",
  "pre-commit>=4.3.0",
  "pyright>=1.1.407",
  "pytest>=8.4.2",
  "ruff>=0.14.7",
  "ty>=0.0.1a29",
]

[project.optional-dependencies]
cu128 = ["torch>=2.7.0"]

[tool.uv]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirrors.tuna.tsinghua.edu.cn/pytorch/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://mirrors.tuna.tsinghua.edu.cn/pytorch/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
# torch = { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" }

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 2
exclude = [
  "src/mjlab/utils/lab_api",
  "typings",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.pyright]
pythonVersion = "3.10"
ignore = ["./typings", "./src/mjlab/utils/lab_api"]
stubPath = "typings"
typeCheckingMode = "off"

[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["src/mjlab/utils/lab_api", "typings"]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "--strict-markers"
